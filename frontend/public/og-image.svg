<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definition matching the primary to accent gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Logo container with rounded corners and gradient -->
  <rect x="450" y="215" width="300" height="200" rx="24" ry="24"
        fill="url(#logoGradient)"
        filter="url(#shadow)"/>

  <!-- Letter E -->
  <text x="600" y="360"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="120"
        font-weight="bold"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle">E</text>

  <!-- Project title -->
  <text x="600" y="480"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="36"
        font-weight="600"
        fill="#e2e8f0"
        text-anchor="middle">Excel to JSON Converter</text>

  <!-- Subtitle -->
  <text x="600" y="530"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="20"
        fill="#94a3b8"
        text-anchor="middle">AI-Powered Data Conversion by EncureIT</text>
</svg>
